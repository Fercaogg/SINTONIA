<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/js/gsap.min.js"></script>
    <script src="assets/js/sx.js"></script>
    <style>
      @font-face { font-family: "Fira Sans"; font-weight: 400; font-style: normal; font-display: block; src: url("assets/fonts/fira-sans-400.woff2") format("woff2"); }
      @font-face { font-family: "Fira Sans"; font-weight: 600; font-style: normal; font-display: block; src: url("assets/fonts/fira-sans-600.woff2") format("woff2"); }
      @font-face { font-family: "Fira Sans"; font-weight: 700; font-style: normal; font-display: block; src: url("assets/fonts/fira-sans-700.woff2") format("woff2"); }
      @font-face { font-family: "Fira Sans"; font-weight: 800; font-style: normal; font-display: block; src: url("assets/fonts/fira-sans-800.woff2") format("woff2"); }
      :root {
        --bg: #f5f7f6;
        --dark: #0a4a6c;
        --ink: #0a4a6c;
        --accent: #34c6a3;
        --action: #1d7060;
        --muted: #5a6b75;
        --border: #e3eaea;
        --card: #ffffff;
        --shadow: 0 18px 48px rgba(10, 74, 108, 0.1), 0 2px 8px rgba(10, 74, 108, 0.06);
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); color: var(--ink); font-family: "Fira Sans", sans-serif; }
      #main { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
      /* shared by every scene */
      .sx-w { display: inline-block; white-space: nowrap; }
      .sx-k { display: inline-block; padding: 0.16em 0 0.1em; margin: -0.16em 0 -0.1em; }
      .src { position: absolute; left: 64px; bottom: 40px; font-size: 14px; font-weight: 400; color: #5a6b75; letter-spacing: 0.01em; z-index: 50; }
      .card { background: #fff; border: 1px solid var(--border); border-radius: 16px; box-shadow: var(--shadow); position: relative; overflow: hidden; }
      .shine { position: absolute; top: -20%; bottom: -20%; left: 0; width: 34%; background: linear-gradient(100deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.75) 50%, rgba(255,255,255,0) 100%); transform: skewX(-18deg); pointer-events: none; }
      .wordmark { font-weight: 800; letter-spacing: 0.05em; color: var(--ink); line-height: 1; }
      .wordmark .i { color: var(--accent); }
    </style>
  </head>
  <body>
    <!--
      SINTONÍA · spot comercial · 60 s · 1920×1080 · 60 fps · sin audio
      Rejilla de 120 BPM: un golpe cada 0,5 s. Todos los cortes y entradas caen en múltiplos de 0,5 s.
      Las escenas se solapan 0,25–0,5 s para que cada transición la dibujen ambos lados.
    -->
    <div id="main" data-composition-id="main" data-start="0" data-duration="60" data-width="1920" data-height="1080">
      <div id="bg" data-composition-id="bg" data-composition-src="compositions/bg.html" class="clip" data-start="0" data-duration="60" data-track-index="0" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index:1;"></div>
      <div id="hook" data-composition-id="hook" data-composition-src="compositions/hook.html" class="clip" data-start="0" data-duration="4.4643" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index:60;"></div>
      <div id="datos" data-composition-id="datos" data-composition-src="compositions/datos.html" class="clip" data-start="3.6071" data-duration="14.5714" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index:20;"></div>
      <div id="reveal" data-composition-id="reveal" data-composition-src="compositions/reveal.html" class="clip" data-start="17.75" data-duration="5.5714" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index:30;"></div>
      <div id="funciona" data-composition-id="funciona" data-composition-src="compositions/funciona.html" class="clip" data-start="22.8929" data-duration="14.5714" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index:35;"></div>
      <div id="confianza" data-composition-id="confianza" data-composition-src="compositions/confianza.html" class="clip" data-start="36.6071" data-duration="10.7143" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index:70;"></div>
      <div id="perfiles" data-composition-id="perfiles" data-composition-src="compositions/perfiles.html" class="clip" data-start="46.8929" data-duration="6.4286" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index:40;"></div>
      <div id="cierre" data-composition-id="cierre" data-composition-src="compositions/cierre.html" class="clip" data-start="52.8929" data-duration="7.1071" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index:50;"></div>
      <audio id="music" class="clip" src="assets/music/sintonia-bgm.mp3" data-start="0" data-duration="60" data-track-index="9" data-timeline-role="music" data-volume="1"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
