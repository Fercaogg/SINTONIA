    <style>
      @font-face { font-family: "Fira Sans"; font-weight: 400; font-style: normal; font-display: block; src: url("assets/fonts/fira-sans-400.woff2") format("woff2"); }
      @font-face { font-family: "Fira Sans"; font-weight: 600; font-style: normal; font-display: block; src: url("assets/fonts/fira-sans-600.woff2") format("woff2"); }
      @font-face { font-family: "Fira Sans"; font-weight: 700; font-style: normal; font-display: block; src: url("assets/fonts/fira-sans-700.woff2") format("woff2"); }
      @font-face { font-family: "Fira Sans"; font-weight: 800; font-style: normal; font-display: block; src: url("assets/fonts/fira-sans-800.woff2") format("woff2"); }
      :root {
        --bg: #f5f7f6;
        --dark: #0a4a6c;
        --ink: #0a4a6c;
        --accent: #34c6a3;
        --action: #1d7060;
        --muted: #5a6b75;
        --border: #e3eaea;
        --card: #ffffff;
        --shadow: 0 18px 48px rgba(10, 74, 108, 0.1), 0 2px 8px rgba(10, 74, 108, 0.06);
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); color: var(--ink); font-family: "Fira Sans", sans-serif; }
      #main { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
      /* shared by every scene */
      .sx-w { display: inline-block; white-space: nowrap; }
      .sx-k { display: inline-block; padding: 0.16em 0 0.1em; margin: -0.16em 0 -0.1em; }
      .src { position: absolute; left: 64px; bottom: 40px; font-size: 14px; font-weight: 400; color: #5a6b75; letter-spacing: 0.01em; z-index: 50; }
      .card { background: #fff; border: 1px solid var(--border); border-radius: 16px; box-shadow: var(--shadow); position: relative; overflow: hidden; }
      .shine { position: absolute; top: -20%; bottom: -20%; left: 0; width: 34%; background: linear-gradient(100deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.75) 50%, rgba(255,255,255,0) 100%); transform: skewX(-18deg); pointer-events: none; }
      .wordmark { font-weight: 800; letter-spacing: 0.05em; color: var(--ink); line-height: 1; }
      .wordmark .i { color: var(--accent); }
    </style>
  </head>
