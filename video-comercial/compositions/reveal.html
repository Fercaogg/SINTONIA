<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; }
    #reveal-cam, #reveal-zoom { position: absolute; inset: 0; }
    #reveal-svg { position: absolute; left: 0; top: 0; }
    #reveal-flash { position: absolute; left: 360px; top: 190px; width: 1200px; height: 700px; border-radius: 50%; background: radial-gradient(closest-side, rgba(255,255,255,1) 0%, rgba(255,255,255,0.85) 35%, rgba(52,198,163,0.18) 70%, rgba(52,198,163,0) 100%); opacity: 0; }
    #reveal-glow { position: absolute; left: 460px; top: 330px; width: 1000px; height: 420px; border-radius: 50%; background: radial-gradient(closest-side, rgba(52,198,163,0.22), rgba(52,198,163,0)); opacity: 0; }
    #reveal-word { position: absolute; left: 0; right: 0; top: 432px; text-align: center; font-size: 210px; }
    #reveal-pill-wrap { position: absolute; left: 0; right: 0; top: 330px; text-align: center; }
    #reveal-pill { display: inline-block; padding: 12px 30px; border-radius: 999px; border: 2px solid #34c6a3; color: #1d7060; background: rgba(52, 198, 163, 0.1); font-size: 28px; font-weight: 700; letter-spacing: 0.14em; }
    #reveal-lema { position: absolute; left: 0; right: 0; top: 700px; text-align: center; font-size: 48px; font-weight: 400; color: #5a6b75; }
  </style>
  <div id="root" data-composition-id="reveal" data-width="1920" data-height="1080">
    <div id="reveal-cam">
      <div id="reveal-zoom">
        <div id="reveal-glow"></div>
        <svg id="reveal-svg" width="1920" height="1080" viewBox="0 0 1920 1080" data-layout-ignore>
          <defs><clipPath id="reveal-clip"><rect id="reveal-clip-r" x="0" y="0" width="0" height="1080"></rect></clipPath></defs>
          <g clip-path="url(#reveal-clip)" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <path id="reveal-wa" stroke="#34C6A3" stroke-width="6"></path>
            <path id="reveal-wb" stroke="#0A4A6C" stroke-width="6"></path>
          </g>
        </svg>
        <div id="reveal-flash"></div>
        <div id="reveal-pill-wrap"><div id="reveal-pill">TUTORÍA DE TFM, TFG Y TESIS</div></div>
        <div id="reveal-word" class="wordmark"><span class="sx-w"><span class="sx-k">S</span><span class="sx-k">I</span><span class="sx-k">N</span><span class="sx-k">T</span><span class="sx-k">O</span><span class="sx-k">N</span><span class="sx-k i">Í</span><span class="sx-k">A</span></span></div>
        <div id="reveal-lema">Acompañar el trabajo académico, sin vigilar.</div>
      </div>
    </div>
  </div>
  <script>
    (function () {
      var T0 = 12.75, D = 4.5;
      function g(t) { return t - T0; }
      var tl = gsap.timeline({ paused: true });
      SX.cam(tl, "#reveal-cam", D);

      // ---- two out-of-step waves → one wave → a line that collects at the centre ----
      function lerp(a, b, m) { return a + (b - a) * m; }
      var wa = document.getElementById("reveal-wa"), wb = document.getElementById("reveal-wb");
      var A = { c: 520, a: 80, wl: 430 }, B = { c: 560, a: 100, wl: 290 }, F = { c: 540, a: 86, wl: 380 };
      var S = { t: 0, m: 0, k: 0 };
      function draw() {
        var m = S.m, k = S.k;
        var x0 = lerp(-60, 470, k), x1 = lerp(1980, 1450, k), amp = 1 - k;
        var shA = S.t * 260, shB = S.t * 150 + 120;
        wa.setAttribute("d", SX.wpath(lerp(A.c, F.c, m), lerp(A.a, F.a, m) * amp, lerp(A.wl, F.wl, m), shA, Math.round(x0), Math.round(x1), 10));
        wb.setAttribute("d", SX.wpath(lerp(B.c, F.c, m), lerp(B.a, F.a, m) * amp, lerp(B.wl, F.wl, m), lerp(shB, shA, m), Math.round(x0), Math.round(x1), 10));
        wa.setAttribute("stroke-width", lerp(6, lerp(12, 4, k), m).toFixed(2));
        wb.setAttribute("stroke-width", lerp(6, 4, m).toFixed(2));
        wb.setAttribute("opacity", (1 - m * 0.9).toFixed(3));
      }
      draw();
      tl.fromTo(S, { t: 0 }, { t: D, duration: D, ease: "none", onUpdate: draw }, 0);
      tl.fromTo("#reveal-clip-r", { attr: { width: 0 } }, { attr: { width: 1920 }, duration: 0.45, ease: "power3.out" }, g(13.0));
      tl.fromTo(S, { m: 0 }, { m: 1, duration: 0.5, ease: "expo.inOut", onUpdate: draw }, g(13.5)); // in sync on the 14.0 beat
      tl.fromTo(S, { k: 0 }, { k: 1, duration: 0.5, ease: "expo.inOut", onUpdate: draw }, g(14.0)); // collects at the centre
      tl.to("#reveal-svg", { opacity: 0, duration: 0.15, ease: "power2.out" }, g(14.5));

      // ---- wordmark with a soft flash on the 14.5 beat ----
      tl.fromTo("#reveal-flash", { opacity: 0, scale: 0.6 }, { opacity: 0.95, scale: 1, duration: 0.12, ease: "power2.out" }, g(14.42));
      tl.to("#reveal-flash", { opacity: 0, scale: 1.25, duration: 0.5, ease: "power2.out" }, g(14.54));
      SX.maskIn(tl, "#reveal-word .sx-k", g(14.5), { d: 0.45, s: 0.04 });
      tl.fromTo("#reveal-word", { scale: 1.06 }, { scale: 1, duration: 0.9, ease: "power3.out" }, g(14.5));
      tl.fromTo("#reveal-glow", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, g(14.6));
      tl.to("#reveal-glow", { scale: 1.08, opacity: 0.7, duration: 0.5, ease: "sine.inOut", yoyo: true, repeat: 2 }, g(15.1));

      // ---- pill above, motto below ----
      SX.maskIn(tl, "#reveal-pill", g(15.0), { d: 0.45 });
      SX.maskIn(tl, SX.split(document.getElementById("reveal-lema"), "w"), g(15.5), { d: 0.5, s: 0.05 });

      // ---- exit: zoom through the wordmark ----
      tl.to("#reveal-zoom", { scale: 7, duration: 0.3, ease: "power3.in", transformOrigin: "50% 50%" }, g(16.72));
      tl.to("#reveal-zoom", { opacity: 0, duration: 0.12, ease: "power2.in" }, g(16.9));

      window.__timelines["reveal"] = tl;
    })();
  </script>
</template>
